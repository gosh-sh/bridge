      - contracts/ethereum/node_modules/
    policy: pull
  allow_failure: false

# Security stage
#
# `cargo audit` is post-alloy (2026-05): 0 vulnerabilities, only
# informational warnings (unmaintained transitive deps). We run with
# `allow_failure: false` so that any *new* RUSTSEC vulnerability hard-fails
# the pipeline. False positives can be silenced via `.cargo/audit.toml`
# (the file is committed and documents the policy).
security:rust:audit:
  extends: .rust_base
  stage: security
  script:
    # `--locked` pins cargo-audit's own deps for reproducibility.
    - cargo install --locked cargo-audit
    - cargo audit
  allow_failure: false
  only:
    - main
    - merge_requests

security:solidity:slither:
  image: trailofbits/eth-security-toolbox:latest
  tags:
    - docker
  stage: security
  script:
    - cd contracts/ethereum
    - slither . --exclude-dependencies || true
  allow_failure: true
  only:
    - main
    - merge_requests

