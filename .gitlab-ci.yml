stages:
  - setup
  - build
  - test
  - security
  - deploy

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  RUST_BACKTRACE: "1"
  FOUNDRY_PROFILE: ci
  # Use CI_JOB_TOKEN for git operations
  GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/$CI_PROJECT_PATH
  CI_SERVER_TLS_CA_FILE: ""

# Cache configuration
.rust_cache: &rust_cache
  cache:
    key: rust-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/
      - target/
    policy: pull-push

.foundry_cache: &foundry_cache
  cache:
    key: foundry-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/out/
      - contracts/ethereum/cache/
    policy: pull-push

# Default image for all jobs (can be overridden)
default:
  image: rust:latest

# Base job for Rust
.rust_base:
  image: rust:latest
  tags:
    - docker
  variables:
    GIT_STRATEGY: clone
  before_script:
    # Configure git to use CI_JOB_TOKEN for GitLab authentication
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@vcs.modus-ponens.com/".insteadOf "https://vcs.modus-ponens.com/"
    - rustc --version
    - cargo --version
    - rustup component add rustfmt clippy

# Base job for Foundry
.foundry_base:
  image: ubuntu:22.04
  tags:
    - docker
  variables:
    FOUNDRY_DIR: "/root/.foundry"
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/$CI_PROJECT_PATH
  before_script:
    # Install dependencies first
    - apt-get update && apt-get install -y curl git nodejs npm
    # Configure git to use CI_JOB_TOKEN for GitLab authentication (after git is installed)
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@vcs.modus-ponens.com/".insteadOf "https://vcs.modus-ponens.com/"
    # Install Foundry
    - curl -L https://foundry.paradigm.xyz | bash
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - source /root/.bashrc || true
    - foundryup || true
    # Verify installations
    - node --version
    - npm --version
    - forge --version
    - cast --version

# Setup stage
setup:rust:
  extends: .rust_base
  stage: setup
  <<: *rust_cache
  script:
    - cargo fetch --locked
  only:
    changes:
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml

setup:foundry:
  extends: .foundry_base
  stage: setup
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    # Install npm dependencies (poseidon-solidity)
    - npm install
    # Install forge dependencies (forge-std)
    - forge install --no-git foundry-rs/forge-std
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/out/
      - contracts/ethereum/cache/
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull-push
  only:
    changes:
      - contracts/ethereum/foundry.toml
      - contracts/ethereum/remappings.txt
      - contracts/ethereum/package.json
      - contracts/ethereum/package-lock.json

# Build stage
build:rust:debug:
  extends: .rust_base
  stage: build
  <<: *rust_cache
  script:
    - cargo build --workspace --all-features
  artifacts:
    paths:
      - target/debug/
    expire_in: 1 day

build:rust:release:
  extends: .rust_base
  stage: build
  <<: *rust_cache
  script:
    - cargo build --workspace --all-features --release
  artifacts:
    paths:
      - target/release/
    expire_in: 1 week
  only:
    - main
    - tags

build:solidity:
  extends: .foundry_base
  stage: build
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    # Install npm dependencies (poseidon-solidity)
    - npm install
    # Install forge dependencies (forge-std)
    - forge install --no-git foundry-rs/forge-std
    # Build contracts
    - forge build
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/out/
      - contracts/ethereum/cache/
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull-push
  artifacts:
    paths:
      - contracts/ethereum/out/
    expire_in: 1 day

# Test stage
test:rust:unit:
  extends: .rust_base
  stage: test
  <<: *rust_cache
  dependencies:
    - build:rust:debug
  script:
    - cargo test --workspace --lib
  coverage: '/^\d+\.\d+% coverage/'

test:rust:integration:
  extends: .rust_base
  stage: test
  <<: *rust_cache
  dependencies:
    - build:rust:debug
  script:
    - cargo test --workspace --test '*'

test:rust:doc:
  extends: .rust_base
  stage: test
  <<: *rust_cache
  script:
    - cargo test --workspace --doc

test:solidity:
  extends: .foundry_base
  stage: test
  dependencies:
    - build:solidity
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    # Install npm dependencies (poseidon-solidity)
    - npm install
    # Install forge dependencies (forge-std)
    - forge install --no-git foundry-rs/forge-std
    # Run tests
    - forge test -vvv
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/out/
      - contracts/ethereum/cache/
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull
  artifacts:
    when: always
    reports:
      junit: contracts/ethereum/test-results.xml

test:solidity:coverage:
  extends: .foundry_base
  stage: test
  dependencies:
    - build:solidity
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    # Install npm dependencies (poseidon-solidity)
    - npm install
    # Install forge dependencies (forge-std)
    - forge install --no-git foundry-rs/forge-std
    # Run coverage
    - forge coverage --report summary
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/out/
      - contracts/ethereum/cache/
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull
  coverage: '/Total.*?(\d+\.\d+)%/'
  only:
    - main
    - merge_requests

# Code quality checks
lint:rust:fmt:
  extends: .rust_base
  stage: test
  script:
    - cargo fmt --all -- --check
  allow_failure: false

lint:rust:clippy:
  extends: .rust_base
  stage: test
  <<: *rust_cache
  script:
    - cargo clippy --all-targets --all-features -- -D warnings
  allow_failure: false

lint:solidity:fmt:
  extends: .foundry_base
  stage: test
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    # Install npm dependencies (poseidon-solidity)
    - npm install
    # Install forge dependencies (forge-std)
    - forge install --no-git foundry-rs/forge-std
    # Check formatting
    - forge fmt --check
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull
  allow_failure: false

# Security stage
security:rust:audit:
  extends: .rust_base
  stage: security
  script:
    - cargo install cargo-audit
    - cargo audit
  allow_failure: true
  only:
    - main
    - merge_requests

security:solidity:slither:
  image: trailofbits/eth-security-toolbox:latest
  tags:
    - docker
  stage: security
  script:
    - cd contracts/ethereum
    - slither . --exclude-dependencies || true
  allow_failure: true
  only:
    - main
    - merge_requests

# Documentation
docs:rust:
  extends: .rust_base
  stage: deploy
  <<: *rust_cache
  script:
    - cargo doc --workspace --no-deps
  artifacts:
    paths:
      - target/doc/
    expire_in: 1 week
  only:
    - main

docs:solidity:
  extends: .foundry_base
  stage: deploy
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    # Install npm dependencies (poseidon-solidity)
    - npm install
    # Install forge dependencies (forge-std)
    - forge install --no-git foundry-rs/forge-std
    # Generate documentation
    - forge doc
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull
  artifacts:
    paths:
      - contracts/ethereum/docs/
    expire_in: 1 week
  only:
    - main

# Deploy stage (placeholder)
deploy:testnet:
  extends: .foundry_base
  stage: deploy
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    # Install npm dependencies (poseidon-solidity)
    - npm install
    # Install forge dependencies (forge-std)
    - forge install --no-git foundry-rs/forge-std
    # Deploy to testnet
    - echo "Deploy to testnet would go here"
    - forge script script/Deploy.s.sol --rpc-url $TESTNET_RPC_URL --broadcast --verify
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull
  only:
    - main
  when: manual
  environment:
    name: testnet

deploy:mainnet:
  extends: .foundry_base
  stage: deploy
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    # Install npm dependencies (poseidon-solidity)
    - npm install
    # Install forge dependencies (forge-std)
    - forge install --no-git foundry-rs/forge-std
    # Deploy to mainnet
    - echo "Deploy to mainnet would go here"
    - forge script script/Deploy.s.sol --rpc-url $MAINNET_RPC_URL --broadcast --verify
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull
  only:
    - tags
  when: manual
  environment:
    name: mainnet

