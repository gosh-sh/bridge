stages:
  - setup
  - build
  - test
  - security
  - deploy

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  RUST_BACKTRACE: "1"
  FOUNDRY_PROFILE: ci
  # Use CI_JOB_TOKEN for git operations
  GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/$CI_PROJECT_PATH
  # Disable TLS verification for self-signed certificates
  GIT_SSL_NO_VERIFY: "true"
  CI_SERVER_TLS_CA_FILE: ""
  # Resolve cargo git deps via the system git CLI so the github.com
  # url.insteadOf rewrite (with $GH_READ_TOKEN) in .rust_base is honoured.
  # Needed by the crates/an-bridge-prover + crates/bridge-evm-aggregator
  # jobs, which pull the private gosh-sh/acki-nacki-to-eth-bridge-halo2-circuits
  # dependency (the other three gosh-sh halo2 repos are public).
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

# Cache configuration
.rust_cache: &rust_cache
  cache:
    key: rust-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/
      - target/
    policy: pull-push

.foundry_cache: &foundry_cache
  cache:
    key: foundry-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/out/
      - contracts/ethereum/cache/
    policy: pull-push

# Default image for all jobs (can be overridden)
default:
  image: rustlang/rust:nightly

# Base job for Rust
.rust_base:
  image: rustlang/rust:nightly
  tags:
    - docker
  variables:
    GIT_STRATEGY: clone
  before_script:
    # Configure git to use CI_JOB_TOKEN for GitLab authentication
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@vcs.modus-ponens.com/".insteadOf "https://vcs.modus-ponens.com/"
    # Authenticate to github.com for the ONE private cargo git dependency
    # (gosh-sh/acki-nacki-to-eth-bridge-halo2-circuits). $GH_READ_TOKEN is a
    # masked+protected CI/CD variable; it is only present on protected refs
    # (main/tags), so the private-dep jobs are gated on it via `rules` and skip
    # cleanly on MR/branch pipelines where it is absent.
    - if [ -n "$GH_READ_TOKEN" ]; then git config --global url."https://${GH_READ_TOKEN}@github.com/".insteadOf "https://github.com/"; fi
    # Ensure we're using nightly toolchain
    - rustup default nightly
    - rustc --version
    - cargo --version
    - rustup component add rustfmt clippy

# Base job for Foundry
.foundry_base:
  image: ubuntu:22.04
  tags:
    - docker
  variables:
    FOUNDRY_DIR: "/root/.foundry"
    GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/$CI_PROJECT_PATH
  before_script:
    # Install dependencies first
    - apt-get update && apt-get install -y curl git nodejs npm
    # Configure git to use CI_JOB_TOKEN for GitLab authentication (after git is installed)
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@vcs.modus-ponens.com/".insteadOf "https://vcs.modus-ponens.com/"
    # Install Foundry
    - curl -L https://foundry.paradigm.xyz | bash
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - source /root/.bashrc || true
    - foundryup || true
    # Verify installations
    - node --version
    - npm --version
    - forge --version
    - cast --version

# Setup stage
setup:rust:
  extends: .rust_base
  stage: setup
  <<: *rust_cache
  script:
    - cargo fetch --locked
  only:
    changes:
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml

setup:foundry:
  extends: .foundry_base
  stage: setup
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    # Install npm dependencies (poseidon-solidity)
    - npm install
    # Install forge dependencies (forge-std) - skip if already exists
    - test -d lib/forge-std || forge install --no-git foundry-rs/forge-std
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/out/
      - contracts/ethereum/cache/
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull-push
  only:
    changes:
      - contracts/ethereum/foundry.toml
      - contracts/ethereum/remappings.txt
      - contracts/ethereum/package.json
      - contracts/ethereum/package-lock.json

# Build stage
build:rust:debug:
  extends: .rust_base
  stage: build
  <<: *rust_cache
  script:
    - cargo build --workspace

build:rust:release:
  extends: .rust_base
  stage: build
  <<: *rust_cache
  script:
    - cargo build --workspace --release
  only:
    - main
    - tags

# bridge-relayer-daemon depends on bridge-prover-lib (halo2) and must build as
# a member of crates/an-bridge-prover (symlink member). Standalone
# `cd crates/bridge-relayer-daemon && cargo …` cannot resolve workspace=true
# circuit deps. Without this job, relayer regressions ship to main silently.
build:rust:relayer:
  extends: .rust_base
  stage: build
  # Pulls the private gosh-sh circuits repo — only runs where $GH_READ_TOKEN
  # (masked+protected) is injected, i.e. protected refs like main/tags.
  rules:
    - if: '$GH_READ_TOKEN'
  cache:
    key: rust-relayer-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/
      - crates/an-bridge-prover/target/
    policy: pull-push
  script:
    - cd crates/an-bridge-prover
    - cargo build --locked -p bridge-relayer-daemon --all-targets

# bridge-evm-aggregator is excluded from the workspace (axiom halo2-lib vs gosh
# fork in the orchestrator). Dedicated build/test keeps R15 regressions visible.
build:rust:aggregator:
  extends: .rust_base
  stage: build
  # Pulls the private gosh-sh circuits repo (transitively) — gated like
  # build:rust:relayer so it runs only where $GH_READ_TOKEN is available.
  rules:
    - if: '$GH_READ_TOKEN'
  cache:
    key: rust-aggregator-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/
      - crates/bridge-evm-aggregator/target/
    policy: pull-push
  script:
    - cd crates/bridge-evm-aggregator
    - cargo build --release --locked --all-targets

build:solidity:
  extends: .foundry_base
  stage: build
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    # Install npm dependencies (poseidon-solidity)
    - npm install
    # Install forge dependencies (forge-std) - skip if already exists
    - test -d lib/forge-std || forge install --no-git foundry-rs/forge-std
    # Build contracts
    - forge build
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/out/
      - contracts/ethereum/cache/
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull-push

# Test stage
test:rust:
  extends: .rust_base
  stage: test
  <<: *rust_cache
  needs:
    - build:rust:debug
  script:
    - cargo test --workspace

# `#[ignore]`-gated live tests (e.g. `tests/live_bk_set_sentry.rs`) stay
# skipped; this job runs the unit + non-live integration tests.
test:rust:relayer:
  extends: .rust_base
  stage: test
  rules:
    - if: '$GH_READ_TOKEN'
  cache:
    key: rust-relayer-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/
      - crates/an-bridge-prover/target/
    policy: pull
  needs:
    - build:rust:relayer
  script:
    - cd crates/an-bridge-prover
    - cargo test --locked -p bridge-relayer-daemon

test:rust:aggregator:
  extends: .rust_base
  stage: test
  rules:
    - if: '$GH_READ_TOKEN'
  cache:
    key: rust-aggregator-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/
      - crates/bridge-evm-aggregator/target/
    policy: pull
  needs:
    - build:rust:aggregator
  script:
    - cd crates/bridge-evm-aggregator
    - cargo test --release --locked
    - chmod +x ../../scripts/check_eip170_verifier_bins.sh
    - ../../scripts/check_eip170_verifier_bins.sh ../../contracts/ethereum/test/fixtures/r15_spike || true

test:solidity:
  extends: .foundry_base
  stage: test
  needs:
    - build:solidity
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    # Install npm dependencies (poseidon-solidity)
    - npm install
    # Install forge dependencies (forge-std) - skip if already exists
    - test -d lib/forge-std || forge install --no-git foundry-rs/forge-std
    # ETH-6: pin SHPLONK .bin hashes before Foundry (pairing is in forge test)
    - chmod +x ../../scripts/check_shplonk_artefacts.sh
    - ../../scripts/check_shplonk_artefacts.sh
    - forge test -vvv
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/out/
      - contracts/ethereum/cache/
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull

# Audit overlay — ETH contract spec tests (branch `audit` + MRs touching audit/ or bridge src)
test:solidity:audit:
  extends: .foundry_base
  stage: test
  needs:
    - build:solidity
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    - npm install
    - test -d lib/forge-std || forge install --no-git foundry-rs/forge-std
    - cd ../../audit/spec/ethereum
    - FOUNDRY_PROFILE=audit forge test -vvv
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/out/
      - contracts/ethereum/cache/
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull
  only:
    refs:
      - audit
      - merge_requests
    changes:
      - audit/**/*
      - contracts/ethereum/src/**/*
      - contracts/ethereum/script/**/*
      - contracts/ethereum/test/**/*

# AN contract audit (pytest + tvm-debugger). Runner must have sibling tvm-sdk built
# (see audit/spec/an/BUILD.md) or cached `.tools/` — otherwise job skips cleanly.
test:an:audit:
  extends: .rust_base
  stage: test
  script:
    - apt-get update && apt-get install -y python3-pip
    - pip install pytest
    - chmod +x scripts/setup_an_audit_tools.sh scripts/ci_an_audit.sh scripts/sync_an_contracts.sh
    - |
      if [[ -x .tools/tvm-debugger ]] && [[ -x .tools/sold ]]; then
        AN_AUDIT_INTEGRATION=0 ./scripts/ci_an_audit.sh
      else
        echo "SKIP test:an:audit — no .tools/tvm-debugger (build ../tvm-sdk locally; gate: make pre-push-an)"
        exit 0
      fi
  allow_failure: true
  only:
    refs:
      - audit
      - merge_requests
    changes:
      - audit/spec/an/**/*
      - audit/spec/an-contracts/**/*
      - deposit-prover/fixtures/deposit_10proofs/**
      - scripts/sync_an_contracts.sh
      - scripts/setup_an_audit_tools.sh
      - scripts/ci_an_audit.sh
      - scripts/check_vk_srs_pin.sh
      - scripts/check_mock_vs_shplonk_smoke.sh
      - scripts/check_mutation_kill_smoke.sh
      - scripts/td_53_dry_run_recovery_smoke.sh
      - scripts/check_td65_g3_smoke.sh
      - scripts/check_an_overlay_patch_matrix.sh
      - deposit-prover/tests/td_43_mock_vs_shplonk.rs
      - deposit-prover/tests/td_49_mutation_kill.rs
      - deposit-prover/src/opcode_triple_verify.rs
      - crates/deposit-relayer-daemon/tests/td_49_mutation_kill_matrix.rs
      - crates/deposit-relayer-daemon/tests/td_53_e2e_runbook_recovery.rs
      - crates/deposit-relayer-daemon/tests/td_65_g3_revert_loop.rs
      - crates/deposit-relayer-daemon/tests/f10_interface_reverted.rs
      - scripts/check_td04_deploy_readiness.sh
      - docs/operations/td-04-an-deploy-owner-handoff.md
      - audit/spec/ethereum/DepositMutationKill.t.sol
      - scripts/embed_deposit_vk_blob.py

# F10 — deposit-relayer off-chain pipeline (Rust; excluded from workspace)
test:deposit-relayer:audit:
  extends: .rust_base
  stage: test
  script:
    - chmod +x scripts/check_deposit_audit_gates.sh
    - ./scripts/check_deposit_audit_gates.sh
    - cd crates/deposit-relayer-daemon && cargo test --locked
  only:
    refs:
      - audit
      - merge_requests
    changes:
      - crates/deposit-relayer-daemon/**/*
      - deposit-prover/fixtures/deposit_10proofs/**
      - audit/spec/an-contracts/exchange/**
      - scripts/check_deposit_audit_gates.sh
      - scripts/check_vk_srs_pin.sh
      - scripts/check_pi_count_docs.sh
      - scripts/check_mock_vs_shplonk_smoke.sh
      - scripts/check_mutation_kill_smoke.sh
      - scripts/td_53_dry_run_recovery_smoke.sh
      - scripts/check_td65_g3_smoke.sh
      - scripts/check_an_overlay_patch_matrix.sh
      - crates/acki-nacki-interface/**/*
      - audit/**/*

# Night profile — heavy fuzz on audit ETH overlay (allow_failure; not MR gate)
test:solidity:audit:ci:
  extends: .foundry_base
  stage: test
  needs:
    - build:solidity
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - chmod +x scripts/ci_eth_audit_night.sh
    - ./scripts/ci_eth_audit_night.sh
  allow_failure: true
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/out/
      - contracts/ethereum/cache/
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull
  only:
    refs:
      - audit
    changes:
      - audit/spec/ethereum/**/*
      - contracts/ethereum/src/**/*

test:solidity:coverage:
  extends: .foundry_base
  stage: test
  # `only: merge_requests` makes this run in a *merge request pipeline*, where
  # `build:solidity` (default `only: branches/tags`) is absent. Mark the need
  # optional so pipeline creation succeeds there; the job rebuilds from scratch
  # anyway (npm install + forge install + forge coverage), so it is self-contained.
  needs:
    - job: build:solidity
      optional: true
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    # Install npm dependencies (poseidon-solidity)
    - npm install
    # Install forge dependencies (forge-std) - skip if already exists
    - test -d lib/forge-std || forge install --no-git foundry-rs/forge-std
    # Run coverage
    - forge coverage --report summary
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/out/
      - contracts/ethereum/cache/
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull
  coverage: '/Total.*?(\d+\.\d+)%/'
  only:
    - main
    - merge_requests

# Code quality checks
lint:rust:fmt:
  extends: .rust_base
  stage: test
  script:
    - cargo fmt --all -- --check
  allow_failure: false

lint:rust:clippy:
  extends: .rust_base
  stage: test
  <<: *rust_cache
  script:
    - cargo clippy --workspace -- -D warnings
  allow_failure: false

# Same gap-coverage rationale as `build:rust:relayer`: clippy/fmt on the
# workspace skip the excluded relayer crate.
lint:rust:relayer:fmt:
  extends: .rust_base
  stage: test
  # `cargo fmt -p …` runs `cargo metadata`, which resolves (and thus fetches)
  # the private circuits dep — gate it on $GH_READ_TOKEN like the other
  # an-bridge-prover jobs.
  rules:
    - if: '$GH_READ_TOKEN'
  script:
    # bridge-relayer-daemon is a symlink member of the crates/an-bridge-prover
    # workspace (it inherits halo2-base etc. from that root). A standalone
    # `cd crates/bridge-relayer-daemon && cargo fmt` fails with "failed to find
    # a workspace root" — same rationale as build:rust:relayer.
    - cd crates/an-bridge-prover
    - cargo fmt -p bridge-relayer-daemon -- --check
  allow_failure: false

lint:rust:relayer:clippy:
  extends: .rust_base
  stage: test
  rules:
    - if: '$GH_READ_TOKEN'
  cache:
    key: rust-relayer-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/
      - crates/an-bridge-prover/target/
    policy: pull
  needs:
    - build:rust:relayer
  script:
    - cd crates/an-bridge-prover
    - cargo clippy --locked -p bridge-relayer-daemon --all-targets --no-deps -- -D warnings
  allow_failure: false

lint:solidity:fmt:
  extends: .foundry_base
  stage: test
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    # Install npm dependencies (poseidon-solidity)
    - npm install
    # Install forge dependencies (forge-std) - skip if already exists
    - test -d lib/forge-std || forge install --no-git foundry-rs/forge-std
    # Check formatting
    - forge fmt --check
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull
  allow_failure: false

# Security stage
#
# `cargo audit` is post-alloy (2026-05): 0 vulnerabilities, only
# informational warnings (unmaintained transitive deps). We run with
# `allow_failure: false` so that any *new* RUSTSEC vulnerability hard-fails
# the pipeline. False positives can be silenced via `.cargo/audit.toml`
# (the file is committed and documents the policy).
security:rust:audit:
  extends: .rust_base
  stage: security
  script:
    # `--locked` pins cargo-audit's own deps for reproducibility.
    - cargo install --locked cargo-audit
    - cargo audit
  allow_failure: false
  only:
    - main
    - merge_requests

security:solidity:slither:
  image: trailofbits/eth-security-toolbox:latest
  tags:
    - docker
  stage: security
  script:
    - cd contracts/ethereum
    - slither . --exclude-dependencies || true
  allow_failure: true
  only:
    - main
    - merge_requests

# Documentation
docs:rust:
  extends: .rust_base
  stage: deploy
  <<: *rust_cache
  script:
    - cargo doc --workspace --no-deps
  artifacts:
    paths:
      - target/doc/
    expire_in: 1 week
  only:
    - main

docs:solidity:
  extends: .foundry_base
  stage: deploy
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    # Install npm dependencies (poseidon-solidity)
    - npm install
    # Install forge dependencies (forge-std) - skip if already exists
    - test -d lib/forge-std || forge install --no-git foundry-rs/forge-std
    # Generate documentation
    - forge doc
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull
  artifacts:
    paths:
      - contracts/ethereum/docs/
    expire_in: 1 week
  only:
    - main

# Deploy stage (placeholder)
deploy:testnet:
  extends: .foundry_base
  stage: deploy
  script:
    - export PATH="$FOUNDRY_DIR/bin:$PATH"
    - cd contracts/ethereum
    # Install npm dependencies (poseidon-solidity)
    - npm install
    # Install forge dependencies (forge-std) - skip if already exists
    - test -d lib/forge-std || forge install --no-git foundry-rs/forge-std
    # Deploy to testnet
    - echo "Deploy to testnet would go here"
    - forge script script/Deploy.s.sol --rpc-url $TESTNET_RPC_URL --broadcast --verify
  cache:
    key: foundry-npm-$CI_COMMIT_REF_SLUG
    paths:
      - contracts/ethereum/lib/
      - contracts/ethereum/node_modules/
    policy: pull
