# The Acki Nacki contracts under contracts/an/ carry three invariants the
# compiler does not check:
#
#   * eccBridge embeds DepositVoucher's code, and the voucher calls back
#     into confirmTokenDeposit. If the sources or the two compiled ABIs disagree on
#     that argument list, deposits abort in the voucher constructor.
#   * BridgeZerostateData.getBridgeData must encode the same tuple that
#     eccBridge.onCodeUpgrade decodes.
#   * The ABIs built into eth-lc-relayer and the CLI's USDCBridge.abi.json
#     copy must hold every function the relayers call and agree with the
#     compiled contracts (scripts/check_lc_relayer_abis.py).
#
# The zerostate module's own unit tests (contracts/an/zerostate_init.py) also
# run here.

when:
  - event: pull_request
  - event: push
    branch: main

steps:
  voucher-abi:
    image: python:3-alpine
    commands:
      - python3 scripts/check_voucher_abi_consistency.py
  zerostate-encoder:
    image: python:3-alpine
    depends_on: [ ]
    commands:
      - python3 scripts/check_zerostate_data_encoder.py
  zerostate-module:
    image: python:3-alpine
    depends_on: [ ]
    commands:
      - python3 contracts/an/zerostate/test_zerostate_init.py
  place-manifest:
    # The check lists tracked files with git. python:3 (Debian) ships it; installing it
    # at run time made the step fail whenever the package mirror did not resolve.
    image: python:3
    depends_on: [ ]
    commands:
      - python3 scripts/check_place_manifest.py
  relayer-abis:
    image: python:3-alpine
    depends_on: [ ]
    commands:
      - python3 scripts/check_lc_relayer_abis.py
