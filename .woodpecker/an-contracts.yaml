# The Acki Nacki contracts under contracts/an/ carry five invariants the
# compiler does not check:
#
#   * eccUSDCBridge embeds DepositVoucher's code, and the voucher calls back
#     into confirmDeposit. If the sources or the two compiled ABIs disagree on
#     that argument list, deposits abort in the voucher constructor.
#   * The deposit verifying key is a hex literal in eccUSDCBridge.sol and must
#     match deposit-prover/fixtures/deposit_10proofs/deposit_vk_blob.bin.
#   * BridgeZerostateData.getBridgeData must encode the same tuple that
#     eccUSDCBridge.onCodeUpgrade decodes.
#   * The trimmed ABIs eth-lc-relayer ships (crates/eth-light-client-relayer/
#     abi/) must match the compiled contracts and hold every function the
#     relayer calls.
#   * The on-AN USDCBridge ABI ships in two runtime copies — one the Rust CLI
#     embeds with include_str!, one tvm-cli reads from the python helper — and
#     they must stay byte-identical. The python copy had fallen 14 functions
#     behind (the whole anchor, source-allowlist and pause surface) and carried
#     a confirmDeposit without chainId, because the guard below existed but no
#     pipeline ran it.
#
# The zerostate module's own unit tests (contracts/an/zerostate_init.py) also
# run here.

when:
  - event: pull_request
  - event: push
    branch: main

steps:
  voucher-abi:
    image: python:3-alpine
    commands:
      - python3 scripts/check_voucher_abi_consistency.py
  bridge-abi-in-sync:
    image: alpine
    depends_on: [ ]
    commands:
      - apk add --no-cache bash diffutils
      - bash scripts/check_bridge_abi_in_sync.sh
  deposit-vk-blob:
    image: python:3-alpine
    depends_on: [ ]
    commands:
      - python3 scripts/embed_deposit_vk_blob.py --check contracts/an/exchange/eccUSDCBridge.sol
  zerostate-encoder:
    image: python:3-alpine
    depends_on: [ ]
    commands:
      - python3 scripts/check_zerostate_data_encoder.py
  zerostate-module:
    image: python:3-alpine
    depends_on: [ ]
    commands:
      - python3 contracts/an/zerostate/test_zerostate_init.py
  place-manifest:
    image: python:3-alpine
    depends_on: [ ]
    commands:
      - apk add --no-cache git
      - python3 scripts/check_place_manifest.py
  relayer-abis:
    image: python:3-alpine
    depends_on: [ ]
    commands:
      - python3 scripts/check_lc_relayer_abis.py
