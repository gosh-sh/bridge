# Halo2 circuit tests for `crates/bridge-circuits/`.
#
# The MockProver-level gadget and integration tests in the vendored circuit
# crates — Circuit 4 (bridge-event-prove-circuit), the layer-hashes-movement
# checker, the BLS attestation checker, cross-circuit block-id parity, and
# the poseidon reference — used to require read access to a private gosh-sh
# repo, so they never had a place in this pipeline. Since the vendoring PR
# they build with only public deps, so a per-MR job is now safe.
#
# Runtime shape: Circuit 4 runs under MockProver at K=19;
# cross-circuit-block-id-test runs Circuit 1 at K=20 (Circuit 1's `K` is
# re-exported as `C1_K` and passed to `MockProver::run` — see
# `crates/bridge-circuits/cross-circuit-block-id-test/tests/cross_circuit_block_id.rs`).
# `historical-layer-hashes-movement-checker-circuit` runs at K=17
# (`pub const K: u32 = 17` in that crate's `src/lib.rs`) — noticeably
# lighter than the K=19/K=20 circuits above, though it still runs in
# the heavy step below with `RUST_TEST_THREADS=1` because it shares
# the step with the K=20 attestation-BLS MockProvers.
# Cold runs are dominated by `cargo build` fetching the pinned gosh git
# deps and compiling the halo2 stack (order of ~2 min on a fresh CI
# checkout), plus another couple of minutes of MockProver test execution
# for the fast step (order of five minutes end-to-end). Warm-cache reruns
# save the build half, but the tests themselves are not seconds-fast.
# Attestation-BLS MockProvers are K=20 and each takes several minutes at
# ~10 GB RSS; real halo2 keygen+prove tests (`test_real_prover_*`) are
# `#[ignore]`d because at K=20 they can run tens of minutes and above
# 14 GB RSS (see `PARALLEL_BENCHMARK_N14_REPORT.md:76-79`). Trigger them
# manually with `cargo test -- --ignored` when the corresponding circuit
# constraints change — see the recipe in AGENTS.md's "What no pipeline
# runs" section for the per-crate weight class.
#
# `bridge-circuits/` is its own sub-workspace with a distinct halo2 backend
# (see the header of `crates/bridge-circuits/Cargo.toml` for why the root
# workspace excludes it). `cd`-then-`cargo test` from inside is the only
# way to run its tests without dragging in the alloy/tvm graph.
#
# `--locked` is NOT passed: `crates/bridge-circuits/Cargo.lock` is
# gitignored (see `.gitignore`), so a fresh CI clone has no lockfile to
# lock to. Pin styles are mixed across the sub-workspace's gosh-sh git
# deps:
#   - `branch = "..."`: halo2-axiom@main,
#     halo2-lib-zkevm-sha256-and-bls12-381@bump-halo2-lib-v0.4.1,
#     gosh-halo2-crypto-lib@bump-halo2-lib-v0.4.1,
#     axiom-eth@gosh-stable-rlcmanager-assignment,
#     gosh-zk-snark-halo2-utils@bump-halo2-lib-v0.4.1.
#   - `tag = "..."`: dense-balanced-tree@v1.0.0.
#   - `rev = "..."`: gosh_blst pinned to a specific commit.
# Branch-pinned deps resolve to whatever tip cargo sees at fetch time,
# so `cargo test` here is deliberately non-deterministic across CI runs.
# Note that the production `crates/bridge-prover-libraries` sub-workspace
# is built with `--locked` against a checked-in `Cargo.lock`, so its
# resolution is frozen and does NOT track branch tips. A green run here
# is therefore only a loose proxy for that prover's build; the coupling
# is not enforced. If a red run needs reproducing, run
# `cargo tree -p <suspect-crate>` locally against the failing commit
# hashes reported in the cargo build output.
#
# All gosh-sh git repos in the dependency graph are public post-vendoring,
# so cargo fetches every dep anonymously — no GitHub token or url rewrite
# is needed here.

when:
  - event: pull_request
  - event: push
    branch: main

variables:
  - &rust_image "docker.gosh.sh/rust"

steps:
  # ---------------------------------------------------------------------------
  # Step 1: fast MockProver tests (Circuit 4 + cross-circuit block-id).
  # Runs first and independently so a red result in the slower step below
  # does not hide a Circuit 4 regression — and so reviewers see the
  # dense-merkle-bound and events-position-binding regressions surface
  # quickly. See the header for the fast-step timing shape (cold-cache runs
  # split roughly evenly between `cargo build` and MockProver test
  # execution; warm-cache reruns save the build half but the tests
  # themselves are not seconds-fast).
  # ---------------------------------------------------------------------------
  bridge-circuits-fast:
    image: *rust_image
    environment:
      CARGO_HOME: .cargo_home
    commands:
      - cd crates/bridge-circuits
      - cargo test --no-fail-fast
          -p bridge-event-prove-circuit
          -p cross-circuit-block-id-test

  # ---------------------------------------------------------------------------
  # Step 2: the rest of the sub-workspace (attestation-BLS MockProvers,
  # historical-layer-hashes MockProver, poseidon reference, test-data-gen).
  # `RUST_TEST_THREADS=1` keeps peak RSS bounded — the K=20 attestation
  # MockProvers pull several GB of witness tables each; running them in
  # parallel OOM-kills the CI worker (SIGKILL). `--no-fail-fast` so a
  # single flake doesn't hide the rest.
  # ---------------------------------------------------------------------------
  bridge-circuits-heavy:
    image: *rust_image
    environment:
      # Keep cargo's registry cache inside the workspace so re-runs on the
      # same worker reuse the same `$CARGO_HOME/git` checkouts (matches
      # `release.yaml`'s convention).
      CARGO_HOME: .cargo_home
      RUST_TEST_THREADS: "1"
    commands:
      - cd crates/bridge-circuits
      - cargo test --workspace --no-fail-fast
          --exclude bridge-event-prove-circuit
          --exclude cross-circuit-block-id-test
