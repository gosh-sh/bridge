# Repository hygiene: committed credentials, links that go nowhere, and text
# that is not in English.
#
# This repository is public, so a credential is compromised the moment it is
# pushed — deleting it in a later commit changes nothing, the object stays in
# the history and in every fork and clone. Hence `gitleaks detect`, which walks
# the whole history rather than just the diff: a key added on a branch and
# removed before merge still has to be found and rotated.
#
# A finding fails the pipeline. It is not a style warning: treat it as "this
# credential is now public, rotate it", and only then decide whether the value
# also needs to be scrubbed from the history.
#
# Rules and the allowlist for shellnet fixtures live in `.gitleaks.toml`.
# No secrets are needed here, and none should ever be added to this pipeline:
# it is the one job that must be safe to run on a pull request from a fork.

when:
  - event: pull_request
  - event: push
    branch: main

variables:
  - &gitleaks_image "docker.gosh.sh/gitleaks"
  - &lychee_image "lycheeverse/lychee"
  - &python_image "python:3-alpine"

# Woodpecker clones shallow by default, and `gitleaks detect` then reports
# "1 commits scanned" — it walks whatever git handed it, so the history check
# silently degrades into a check of the tip commit. A full clone is the whole
# point of this job.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0

steps:
  gitleaks:
    image: *gitleaks_image
    commands:
      - gitleaks detect --config .gitleaks.toml --verbose --redact

  # Same job, second question: does the documentation send a reader anywhere
  # that no longer exists. It rides along here because it wants the same
  # things — a clone, no secrets, every pull request — and a second pipeline
  # for it would only be a second thing to keep green.
  links:
    image: *lychee_image
    depends_on: [ ]
    commands:
      - lychee --config lychee.toml --no-progress '**/*.md' 'Cargo.toml' 'README.md'

  # Third question, same reasoning as the second: is every comment and every
  # document still in English. A comment written in another language is
  # invisible to half the people who will read the code next, and it is usually
  # the sentence that explains *why* — the part that cannot be recovered from
  # the code.
  #
  # Intentional non-Latin text (fixtures, matching a localised tool's output)
  # is exempted per line with a `non-english-ok` marker; the script's docstring
  # is the reference. `make english-check` runs exactly this locally, and
  # `make pre-push` includes it; pass paths to check a subset.
  #
  # `python:3-alpine` has no git, so the script falls back to walking the
  # working tree — the same file set as `git ls-files` in a fresh clone, and
  # not worth a package install to make exact.
  english:
    image: *python_image
    depends_on: [ ]
    commands:
      - python3 scripts/check_english_only.py

  # Fourth question: does the text say which of the two assets it means. The
  # bridge holds Circle's USDC on Ethereum and issues a wrapped token against
  # it on Acki Nacki. Writing both as "USDC" makes prose and identifiers lie
  # about which side of the bridge they are on, and that confusion is
  # expensive in an audit. Ours is `eccUSDC`, on both sides; a bare mention is
  # reserved for the genuine token and has to be declared as such, either in
  # `usdc-naming.toml` or with a `real-usdc-ok` marker on the line.
  #
  # THIS STEP IS RED ON PURPOSE. It reports every unprefixed mention in the
  # repository — contents and file names — and nothing has been triaged yet.
  # Deciding which mentions are Circle's token and which are ours is the work
  # this step exists to scope; until that is done and recorded, the pipeline
  # stays red and nothing merges on its word.
  #
  # `make usdc-check` runs exactly this locally. Deliberately NOT part of
  # `make pre-push`: that gate is meant to be green, and wiring a known-red
  # check into it would train everyone to ignore it.
  ecc-usdc:
    image: *python_image
    depends_on: [ ]
    commands:
      - python3 scripts/check_ecc_usdc_prefix.py
