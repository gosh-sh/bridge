# Tell the author of a pull request, in Discord, that someone has reviewed it.
#
# Woodpecker has no trigger for "a review was submitted" — its events are push,
# pull_request, pull_request_closed, tag, release, deployment, cron and manual,
# and the webhook it installs is not even subscribed to GitHub's
# pull_request_review. So this runs on a schedule.
#
# Which reviews are new is decided by Woodpecker's own history rather than by a
# fixed window: each run covers (start of the last successful cron run, start of
# this run]. Consecutive runs therefore cover exactly adjacent spans, so a manual
# run or a restart cannot re-send what a successful run already sent, and an
# outage is caught up on the next success instead of falling through the gap.
#
# Create the cron in the repository settings on builder.gosh.sh:
#   name: review-submitted, schedule: */10 * * * *
# The secrets below need the `cron` event enabled, on top of `pull_request`
# that the review-request pipeline needs — a secret is only handed to the
# events ticked on it.

when:
  - event: cron
    cron: review-submitted

skip_clone: true

steps:
  window:
    # alpine/curl and not curlimages/curl: the latter runs as an unprivileged
    # user and cannot create the workspace directory when it is the first step.
    image: alpine/curl
    environment:
      WOODPECKER_TOKEN:
        from_secret: WOODPECKER_TOKEN
      # Only used the very first time, when there is no successful run to
      # continue from.
      FALLBACK_SECONDS: "600"
    commands:
      - |
        WP_URL="$CI_SYSTEM_URL"
        if [ -z "$WP_URL" ]; then WP_URL="https://builder.gosh.sh"; fi

        UNTIL="$CI_PIPELINE_STARTED"
        if [ -z "$UNTIL" ]; then UNTIL=$(date +%s); fi

        REPO_ID=$(curl -sS -H "Authorization: Bearer $WOODPECKER_TOKEN" \
          "$WP_URL/api/repos/lookup/$CI_REPO_OWNER/$CI_REPO_NAME" \
          | grep -o '"id":[0-9]*' | head -1 | cut -d : -f 2)

        # The current run is still "running", so it cannot match itself here.
        SINCE=$(curl -sS -H "Authorization: Bearer $WOODPECKER_TOKEN" \
          "$WP_URL/api/repos/$REPO_ID/pipelines?event=cron&status=success&perPage=1" \
          | grep -o '"started":[0-9]*' | head -1 | cut -d : -f 2)

        if [ -z "$SINCE" ]; then
          SINCE=$(expr "$UNTIL" - "$FALLBACK_SECONDS")
          echo "No successful cron run to continue from — starting $FALLBACK_SECONDS seconds back."
        fi

        echo "$SINCE" >since.txt
        echo "$UNTIL" >until.txt
        echo "Window: $SINCE .. $UNTIL"

  find_reviews:
    image: maniator/gh
    environment:
      GH_TOKEN:
        from_secret: REVIEW_GH_TOKEN
      DISCORD_REVIEWERS_MAP:
        from_secret: DISCORD_REVIEWERS_MAP
    commands:
      - |
        rm -f discord-review-*.json
        SINCE=$(cat since.txt)
        UNTIL=$(cat until.txt)
        export SINCE UNTIL

        # One query for every open PR: reviews younger than the window, by
        # someone other than the author. GraphQL keeps this off the REST budget
        # that Woodpecker itself spends reading pipeline configs.
        gh api graphql -F owner="$CI_REPO_OWNER" -F name="$CI_REPO_NAME" -f query='
          query($owner: String!, $name: String!) {
            repository(owner: $owner, name: $name) {
              pullRequests(states: OPEN, first: 50, orderBy: {field: UPDATED_AT, direction: DESC}) {
                nodes {
                  number
                  url
                  isDraft
                  author { login }
                  reviews(last: 20) { nodes { author { login } state submittedAt } }
                }
              }
            }
          }' --jq '
          (env.SINCE | tonumber) as $since | (env.UNTIL | tonumber) as $until |
          .data.repository.pullRequests.nodes[]
          | select(.isDraft | not)
          | . as $pr
          | .reviews.nodes[]
          | select(.submittedAt != null)
          | select((.submittedAt | fromdateiso8601) > $since and (.submittedAt | fromdateiso8601) <= $until)
          | select(.author.login != $pr.author.login)
          | "\($pr.number) \($pr.author.login) \(.author.login) \(.state) \($pr.url)"' >/tmp/reviews.txt

        if [ ! -s /tmp/reviews.txt ]; then
          echo "No review submitted in this window."
          exit 0
        fi

        N=0
        while read -r NUMBER AUTHOR REVIEWER STATE URL; do
          [ -n "$NUMBER" ] || continue

          ID=$(echo "$DISCORD_REVIEWERS_MAP" | tr ',' '\n' | tr -d ' @' | grep "^$AUTHOR=" | head -n 1 | cut -d '=' -f 2-)
          if [ -z "$ID" ]; then
            echo "PR #$NUMBER: $AUTHOR has no entry in DISCORD_REVIEWERS_MAP, not pinged"
            continue
          fi

          case "$STATE" in
            APPROVED) HEADLINE="✅ **Approved**" ;;
            CHANGES_REQUESTED) HEADLINE="❌ **Changes requested**" ;;
            *) HEADLINE="💬 **Comment left**" ;;
          esac

          # Safe to assemble by hand: every value here is a GitHub login, a state
          # enum, a number or a github.com URL — none of them can carry a quote.
          #
          # flags 4 is SUPPRESS_EMBEDS: without it Discord unfurls the PR link
          # into a preview card that is taller than the message itself and
          # repeats what the line already says. The link stays clickable.
          N=$(expr "$N" + 1)
          printf '{"content":"<@%s> %s by `%s` on PR #%s — %s","allowed_mentions":{"parse":["users"]},"flags":4}' \
            "$ID" "$HEADLINE" "$REVIEWER" "$NUMBER" "$URL" >"discord-review-$N.json"
          echo "PR #$NUMBER: $REVIEWER -> $AUTHOR ($STATE)"
        done </tmp/reviews.txt

        echo "$N message(s) to send."

  notify_discord:
    image: curlimages/curl
    environment:
      DISCORD_BOT_TOKEN:
        from_secret: DISCORD_BOT_TOKEN
      DISCORD_CHANNEL_ID:
        from_secret: DISCORD_CHANNEL_ID
    commands:
      - |
        SENT=0
        for FILE in discord-review-*.json; do
          [ -e "$FILE" ] || continue

          CODE=$(curl -sS -X POST \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            --data @"$FILE" \
            -o /tmp/discord-response.json -w '%{http_code}' \
            "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_ID/messages")

          if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
            SENT=$(expr "$SENT" + 1)
          else
            echo "Discord refused $FILE: HTTP $CODE"
            cat /tmp/discord-response.json
            echo
            exit 1
          fi
        done

        echo "$SENT message(s) delivered."
