# Build the release assets `scripts/install.sh` downloads, and attach them to
# the GitHub release for the tag.
#
# The manifest is the installer's, not this pipeline's: it fetches
# `ackinacki-bridge-linux-x86_64.tar.gz`, `kzg_bn254_21.srs`,
# `kzg_params_18.srs` and `SHA256SUMS` from `releases/latest/download`, and
# checks every asset against that `SHA256SUMS` — so a release missing one of
# the four leaves the documented first step of QUICKSTART.md returning 404.
#
# The tarball is unpacked with `--strip-components=1`, so everything sits under
# one top-level directory, and the installer then expects exactly:
#
#   ackinacki-bridge     the CLI
#   aggregate-proof      the prover subprocess the CLI shells out to
#   verifiers/*.bin      the bytecode stage 1 compares with the deployed verifier
#   verifiers/*.sol      the source the proof is self-checked against
#   bridge_config        the profile it writes as <prefix>/profile.release
#   deposit-prover/      the deposit prover, the working directory of its tools:
#                        fetch_deposit_data, export_blake2b_proof and
#                        export_vk_blob, configs/circuit_params.json, and an
#                        empty data/ for the SRS and the proving key. Laid out
#                        by crates/ackinacki-bridge/scripts/stage_deposit_prover.sh
#
# The ceremony files are not built here — both are the Hermez KZG setup and
# identical for every release: `kzg_bn254_21.srs` (257 MB) for withdrawals and
# `kzg_params_18.srs` (33 MB) for deposits, which the installer puts into
# deposit-prover/data/. The first tagged release without one needs it uploaded
# by hand; after that this pipeline carries it forward from the previous
# release, so it only ever has to be done once.
#
# The build fails at once while `MIN_BRIDGE_VERSION` in
# crates/ackinacki-bridge/src/deposit/an_preflight.rs is still `None`: that CLI
# would refuse every bridge. The CLI is built with no cargo features, so the
# development-only `dev-unfixed-bridge` never reaches a release. Nothing is
# published until `verify-deposit-prover` has unpacked the tarball outside the
# source tree and checked the deposit prover in it with
# scripts/check_deposit_prover_bundle.sh: the verification key it derives must
# be the one the Acki Nacki bridge embeds, and it must prove the fixture
# deposit to the fixture's public inputs.
#
# Secret: REVIEW_GH_TOKEN, the same one the review pipelines use — release
# assets sit under a fine-grained token's **Contents** permission, so it needs
# Contents: Read and write, and the `tag` event ticked alongside pull_request
# and cron. One token doing both jobs means the review pipelines can write to
# the repository too; a separate RELEASE_GH_TOKEN is the alternative, and only
# this `from_secret` line changes.
#
# Secret: WC_PROJECT_ID, the WalletConnect Cloud project id the CLI compiles in
# as the default for `deposit --wc-project-id`, with the `tag` event ticked.
# Without it the release has no default, and a WalletConnect deposit needs the
# flag.

when:
  - event: tag
    ref: refs/tags/v*

variables:
  - &rust_image "docker.gosh.sh/rust"

steps:
  build:
    image: *rust_image
    environment:
      # Keep cargo's data inside the workspace so the next step still sees it.
      CARGO_HOME: .cargo_home
      # Read at compile time (`option_env!`) as the default --wc-project-id.
      ACKINACKI_BRIDGE_WC_PROJECT_ID:
        from_secret: WC_PROJECT_ID
    commands:
      # A release must know the bridge version it requires; see an_preflight.rs.
      # Checked before the builds, so such a tag fails in seconds.
      - |
        grep -q '^pub const MIN_BRIDGE_VERSION: Option<BridgeVersion> = Some(' crates/ackinacki-bridge/src/deposit/an_preflight.rs ||
          { echo "MIN_BRIDGE_VERSION is None: this build would refuse every bridge"; exit 1; }
      # A secret that is not set arrives as an empty string, which the CLI would
      # compile in as a project id; unset, it compiles in none.
      - |
        if [ -z "$ACKINACKI_BRIDGE_WC_PROJECT_ID" ]; then
          unset ACKINACKI_BRIDGE_WC_PROJECT_ID
          echo "WC_PROJECT_ID is not set: this release has no default --wc-project-id"
        fi
      # All gosh-sh git repos in the dependency graph are public
      # post-vendoring, so no token is required for cargo to fetch them.
      # The CLI builds as a member of the prover workspace — the symlink at
      # crates/bridge-prover-libraries/ackinacki-bridge is what resolves its
      # workspace=true circuit dependencies. A standalone `cargo build` in
      # crates/ackinacki-bridge cannot see them. No --features: a release
      # carries neither dev-unfixed-bridge nor e2e.
      - cd crates/bridge-prover-libraries
      - cargo build --release --locked -p ackinacki-bridge
      - cd ../bridge-evm-aggregator
      - cargo build --release --locked --bin aggregate-proof
      # deposit-prover is its own workspace with its own rust-toolchain.toml,
      # and its tools are cargo examples, used as they are.
      - cd ../../deposit-prover
      - cargo build --release --locked --examples
      - cd ..

  package:
    image: *rust_image
    commands:
      - |
        STAGE=dist/ackinacki-bridge-linux-x86_64
        rm -rf dist && mkdir -p "$STAGE/verifiers"

        install -m 0755 crates/bridge-prover-libraries/target/release/ackinacki-bridge "$STAGE/"
        install -m 0755 crates/bridge-evm-aggregator/target/release/aggregate-proof "$STAGE/"
        cp contracts/ethereum/verifiers/*.bin contracts/ethereum/verifiers/*.sol "$STAGE/verifiers/"
        cp crates/ackinacki-bridge/config/bridge_config "$STAGE/"
        crates/ackinacki-bridge/scripts/stage_deposit_prover.sh "$STAGE/deposit-prover" --no-build

        tar -czf ackinacki-bridge-linux-x86_64.tar.gz -C dist ackinacki-bridge-linux-x86_64
        ls -l ackinacki-bridge-linux-x86_64.tar.gz

  verify-deposit-prover:
    image: *rust_image
    commands:
      - |
        # Unpacked outside the source tree, as a user gets it.
        OUT=$(mktemp -d)
        tar -xzf ackinacki-bridge-linux-x86_64.tar.gz -C "$OUT" --strip-components=1
        # The Hermez k=18 file, from the address deposit-prover/download_trusted_setup.sh uses.
        curl -fL -o "$OUT/deposit-prover/data/kzg_params_18.srs" \
          https://trusted-setup-halo2kzg.s3.eu-central-1.amazonaws.com/hermez-raw-18
        scripts/check_deposit_prover_bundle.sh "$OUT/deposit-prover" deposit-prover/fixtures/deposit_10proofs

  publish:
    image: maniator/gh
    environment:
      GH_TOKEN:
        from_secret: REVIEW_GH_TOKEN
    commands:
      - |
        REPO="$CI_REPO_OWNER/$CI_REPO_NAME"
        TAG="$CI_COMMIT_TAG"
        echo "Publishing to $REPO $TAG"

        # Carry the ceremonies forward from whichever release last had them.
        # Release assets do not inherit, so without this every tag would need
        # the 257 MB and 33 MB uploads repeated by hand.
        PREVIOUS=$(gh release list -R "$REPO" --limit 20 --json tagName,isDraft \
          --jq '[.[] | select(.isDraft | not) | .tagName] | map(select(. != "'"$TAG"'")) | .[0] // empty')
        if [ -n "$PREVIOUS" ] && gh release download "$PREVIOUS" -R "$REPO" \
             --pattern kzg_bn254_21.srs --output kzg_bn254_21.srs 2>/dev/null; then
          echo "Ceremony carried over from $PREVIOUS."
        else
          echo "No kzg_bn254_21.srs on any earlier release — upload it once to $TAG by hand:"
          echo "  gh release upload $TAG kzg_bn254_21.srs -R $REPO"
          echo "Until then the installer's ceremony step 404s."
        fi

        # The same for the deposit prover's k=18 file. A hand upload also needs
        # its line in SHA256SUMS, or the installer refuses it.
        if [ -n "$PREVIOUS" ] && gh release download "$PREVIOUS" -R "$REPO" \
             --pattern kzg_params_18.srs --output kzg_params_18.srs 2>/dev/null; then
          echo "Deposit ceremony carried over from $PREVIOUS."
        else
          echo "No kzg_params_18.srs on any earlier release — upload it once to $TAG by hand,"
          echo "with a SHA256SUMS that lists it:"
          echo "  gh release upload $TAG kzg_params_18.srs SHA256SUMS --clobber -R $REPO"
          echo "Until then the installer's deposit ceremony step 404s."
        fi

        # One SHA256SUMS over whatever is actually being shipped: the installer
        # refuses an asset it cannot find a line for.
        sha256sum ackinacki-bridge-linux-x86_64.tar.gz >SHA256SUMS
        if [ -f kzg_bn254_21.srs ]; then
          sha256sum kzg_bn254_21.srs >>SHA256SUMS
        fi
        if [ -f kzg_params_18.srs ]; then
          sha256sum kzg_params_18.srs >>SHA256SUMS
        fi
        cat SHA256SUMS

        # `gh release upload` requires the release to exist — a tag alone is not
        # one — so create it on first sight of the tag.
        if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
          gh release create "$TAG" -R "$REPO" --title "$TAG" --notes "Assets built by .woodpecker/release.yaml."
        fi

        # --clobber so re-running a tag replaces its assets instead of failing.
        gh release upload "$TAG" -R "$REPO" --clobber \
          ackinacki-bridge-linux-x86_64.tar.gz SHA256SUMS
        if [ -f kzg_bn254_21.srs ]; then
          gh release upload "$TAG" -R "$REPO" --clobber kzg_bn254_21.srs
        fi
        if [ -f kzg_params_18.srs ]; then
          gh release upload "$TAG" -R "$REPO" --clobber kzg_params_18.srs
        fi
        echo "Done."
