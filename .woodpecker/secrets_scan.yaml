# Scan the repository for committed credentials.
#
# This repository is public, so a credential is compromised the moment it is
# pushed — deleting it in a later commit changes nothing, the object stays in
# the history and in every fork and clone. Hence `gitleaks detect`, which walks
# the whole history rather than just the diff: a key added on a branch and
# removed before merge still has to be found and rotated.
#
# A finding fails the pipeline. It is not a style warning: treat it as "this
# credential is now public, rotate it", and only then decide whether the value
# also needs to be scrubbed from the history.
#
# Rules and the allowlist for shellnet fixtures live in `.gitleaks.toml`.
# No secrets are needed here, and none should ever be added to this pipeline:
# it is the one job that must be safe to run on a pull request from a fork.

when:
  - event: pull_request
  - event: push
    branch: main

variables:
  - &gitleaks_image "docker.gosh.sh/gitleaks"

steps:
  gitleaks:
    image: *gitleaks_image
    commands:
      - gitleaks detect --config .gitleaks.toml --verbose --redact
