# Compile and test the Ethereum contracts on every GitHub PR.
#
# Solidity jobs otherwise live only on the GitLab mirror. A comment-only
# commit once stripped NatSpec and left a file-level `event` the compiler
# rejects; both GitHub PR checks stayed green. This pipeline is the gate
# that would have caught it.
#
# Fork tests need a mainnet RPC and stay on GitLab (`FOUNDRY_PROFILE=fork`).

when:
  - event: pull_request
  - event: push
    branch: main

steps:
  forge:
    image: ubuntu:22.04
    environment:
      # Explicit install prefix, same as the mirror's `.foundry_base` job.
      FOUNDRY_DIR: /root/.foundry
    commands:
      - apt-get update && apt-get install -y --no-install-recommends curl git ca-certificates nodejs npm
      - curl -L https://foundry.paradigm.xyz | bash
      # Shell variables stay unbraced. Woodpecker expands the braced form from
      # its own metadata before the container sees the script, and neither HOME
      # nor PATH is one of its variables, so braces here resolved to an empty
      # string and wiped PATH for every later command in the step. Keep braced
      # sequences out of this file entirely, comments included.
      - export PATH="$FOUNDRY_DIR/bin:$PATH"
      - foundryup
      # Fail here, not four commands later, if the toolchain did not land.
      - forge --version
      - cd contracts/ethereum
      - npm install
      - test -d lib/forge-std || forge install --no-git foundry-rs/forge-std
      - forge build
      - forge fmt --check
      - forge test --no-match-contract Fork
