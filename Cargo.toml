[workspace]
resolver = "2"
members = [
    "crates/eth-frontend",
    "crates/crypto",
    "crates/merkle-tree",
    "crates/zk-proofs",
    "crates/acki-nacki-interface",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Acki Nacki Bridge Team"]
license = "MIT OR Apache-2.0"
repository = "https://vcs.modus-ponens.com/ton/acki-nacki-bridge"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Ethereum
ethers = { version = "2.0", features = ["abigen", "ws", "rustls"] }
alloy-primitives = "0.8"
alloy-sol-types = "0.8"

# Cryptography
ark-ff = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-serialize = "0.4"
# Poseidon hash - using pse-poseidon (same as halo2-base uses for testing)
pse-poseidon = { git = "https://github.com/axiom-crypto/pse-poseidon.git" }

# halo2curves for ff::PrimeField compatible BN254
halo2curves-axiom = { version = "0.7", package = "halo2curves-axiom" }
ff = "0.13"
sha3 = "0.10"
rand = "0.8"
rand_chacha = "0.3"

# ZK Proofs (Halo2) - using halo2-lib for simpler API
halo2-base = { git = "https://github.com/axiom-crypto/halo2-lib.git", tag = "v0.5.0", default-features = false, features = [
    "halo2-axiom",
    "display",
] }
halo2-ecc = { git = "https://github.com/axiom-crypto/halo2-lib.git", tag = "v0.5.0", default-features = false, features = [
    "halo2-axiom",
    "display",
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
proptest = "1.6"
mockall = "0.13"

# Utilities
hex = "0.4"
bytes = "1.9"
