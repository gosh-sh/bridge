[workspace]
resolver = "2"
members = [
    "crates/eth-frontend",
    "crates/acki-nacki-interface",
    "crates/deposit-chain-ids",
]

exclude = [
    "deposit-prover",
    "frontend",
    "crates/bridge-snark-utils",
    "crates/bridge-relayer-daemon",
    "crates/ackinacki-bridge",
    "crates/deposit-relayer-daemon",
    "crates/bridge-prover-libraries",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Acki Nacki Bridge Team"]
license = "MIT OR Apache-2.0"
repository = "https://vcs.modus-ponens.com/ton/acki-nacki-bridge"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Ethereum
alloy = { version = "2.0", features = [
    "providers",
    "provider-http",
    "rpc-types-eth",
    "signer-local",
    "signers",
    "contract",
    "network",
    "sol-types",
    "transport-http",
] }
alloy-primitives = "1"
alloy-sol-types = "1"


# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
proptest = "1.6"
mockall = "0.13"

# HTTP client (matches the version transitively pulled by `alloy = "2.0"` to
# keep one reqwest in the tree).
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "http2",
    "charset",
] }

# Utilities
hex = "0.4"
bytes = "1.9"

tvm_client = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = "v3.0.5.an", default-features = false, features = [
    "std",
    "rustls-tls-webpki-roots",
] }
