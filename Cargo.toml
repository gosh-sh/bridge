[workspace]
resolver = "2"
members = ["crates/eth-frontend", "crates/acki-nacki-interface"]
# Exclude deposit-prover because it uses axiom-crypto's halo2-lib (incompatible with scroll-tech)
# Exclude frontend because it's a separate WASM project with different dependencies
# Exclude poseidon-proof because it uses halo2-base/axiom (incompatible with workspace deps)
exclude = [
    "deposit-prover",
    "frontend",
    "poseidon-proof",
    "crates/bridge-prover-orchestrator",
    "crates/bridge-relayer-daemon",
    "crates/deposit-relayer-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Acki Nacki Bridge Team"]
license = "MIT OR Apache-2.0"
repository = "https://vcs.modus-ponens.com/ton/acki-nacki-bridge"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Ethereum (alloy-rs, migrated 2026-05-17 from ethers-rs 2.0.14 — the latter
# is unmaintained and pulls rustls-webpki 0.101.7 carrying RUSTSEC-2026-0098,
# RUSTSEC-2026-0099, RUSTSEC-2026-0104 via transitive deps. `alloy = "2.0"`
# uses rustls 0.23 + rustls-webpki 0.103, eliminating all three CVEs.
alloy = { version = "2.0", features = [
    "providers",
    "provider-http",
    "rpc-types-eth",
    "signer-local",
    "signers",
    "contract",
    "network",
    "sol-types",
    "transport-http",
] }
alloy-primitives = "1"
alloy-sol-types = "1"


# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
proptest = "1.6"
mockall = "0.13"

# HTTP client (matches the version transitively pulled by `alloy = "2.0"` to
# keep one reqwest in the tree).
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "http2",
    "charset",
] }

# Utilities
hex = "0.4"
bytes = "1.9"
