[workspace]
resolver = "2"
members = ["crates/eth-frontend", "crates/acki-nacki-interface"]
# Exclude deposit-prover because it uses axiom-crypto's halo2-lib (incompatible with scroll-tech)
# Exclude frontend because it's a separate WASM project with different dependencies
# Exclude poseidon-proof because it uses halo2-base/axiom (incompatible with workspace deps)
exclude = [
    "deposit-prover",
    "frontend",
    "poseidon-proof",
    "layer-hashes-prover",
    "crates/bridge-prover-orchestrator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Acki Nacki Bridge Team"]
license = "MIT OR Apache-2.0"
repository = "https://vcs.modus-ponens.com/ton/acki-nacki-bridge"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Ethereum
ethers = { version = "2.0", features = ["abigen", "ws", "rustls"] }
alloy-primitives = "0.8"
alloy-sol-types = "0.8"


# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
proptest = "1.6"
mockall = "0.13"

# Utilities
hex = "0.4"
bytes = "1.9"
