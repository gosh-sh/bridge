[workspace]
resolver = "2"
members = [
    "crates/eth-frontend",
    "crates/crypto",
    "crates/merkle-tree",
    "crates/zk-proofs",
    "crates/acki-nacki-interface",
    "crates/verifier-generator",
]

[patch."https://github.com/privacy-scaling-explorations/poseidon.git"]
poseidon = { git = "https://github.com/scroll-tech/poseidon.git", branch = "main" }

[patch.crates-io]
halo2curves = { git = "https://github.com/scroll-tech/halo2curves", branch = "v0.1.0" }

[patch."https://github.com/privacy-scaling-explorations/halo2.git"]
halo2_proofs = { git = "https://github.com/scroll-tech/halo2.git", branch = "v1.1" }

[patch."https://github.com/privacy-scaling-explorations/bls12_381"]
bls12_381 = { git = "https://github.com/scroll-tech/bls12_381", branch = "feat/impl_scalar_field" }

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Acki Nacki Bridge Team"]
license = "MIT OR Apache-2.0"
repository = "https://vcs.modus-ponens.com/ton/acki-nacki-bridge"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Ethereum
ethers = { version = "2.0", features = ["abigen", "ws", "rustls"] }
alloy-primitives = "0.8"
alloy-sol-types = "0.8"

# Cryptography
ark-ff = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-serialize = "0.4"
# Halo2 - using scroll-tech fork for Poseidon compatibility
halo2_proofs = { git = "https://github.com/scroll-tech/halo2.git", branch = "v1.1" }
halo2_gadgets = { git = "https://github.com/scroll-tech/halo2.git", branch = "v1.1", features = [
    "unstable",
] }
halo2-base = { git = "https://github.com/scroll-tech/halo2-lib", branch = "develop", default-features = false, features = [
    "halo2-pse",
    "display",
] }
halo2-ecc = { git = "https://github.com/scroll-tech/halo2-lib", branch = "develop", default-features = false, features = [
    "halo2-pse",
    "display",
] }

# Poseidon - using scroll-tech implementation
poseidon = { git = "https://github.com/scroll-tech/poseidon.git", branch = "main" }
poseidon-circuit = { git = "https://github.com/scroll-tech/poseidon-circuit", branch = "main" }
poseidon-base = { git = "https://github.com/scroll-tech/poseidon-circuit", branch = "main" }

# SNARK verifier - using scroll-tech for Solidity verifier generation
snark-verifier = { git = "https://github.com/scroll-tech/snark-verifier", branch = "develop", default-features = false, features = [
    "loader_evm",
    "loader_halo2",
    "halo2-pse",
] }
snark-verifier-sdk = { git = "https://github.com/scroll-tech/snark-verifier", branch = "develop", default-features = false, features = [
    "loader_evm",
    "loader_halo2",
    "halo2-pse",
] }

ff = "0.13"
sha3 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
itertools = "0.11"


# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
proptest = "1.6"
mockall = "0.13"

# Utilities
hex = "0.4"
bytes = "1.9"
