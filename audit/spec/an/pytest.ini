[pytest]
minversion = 7.0
testpaths = unit integration vuln
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    unit: Single-contract, single-call tests (no MessagePipeline)
    integration: Multi-contract message-passing via MessagePipeline
    property: Hypothesis / property-based (F7)
    fuzz: Message-order / schedule exploration (F8)
    vuln: PoC tests for findings (red→green; xfail until fixed)
    e2e: Requires live Acki Nacki node (off by default)
    slow: Takes >5s
    bc_regression: F8-F BC-AN-01/02 gate — green while BC open; update after author fix
