[pytest]
minversion = 7.0
testpaths = unit integration vuln
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    unit: Single-contract, single-call tests (no MessagePipeline)
    integration: Multi-contract message-passing via MessagePipeline
    vuln: PoC tests for findings (red→green; xfail until fixed)
    e2e: Requires live Acki Nacki node (off by default)
    slow: Takes >5s
