[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.19"
optimizer = false
via_ir = false
remappings = ["poseidon-solidity/=node_modules/poseidon-solidity/"]
ffi = true
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 1000 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
