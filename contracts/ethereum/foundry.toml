[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.19"
optimizer = true
optimizer_runs = 1 # Optimize for deployment size, not runtime gas
via_ir = true # Required for large contracts to avoid "stack too deep" errors
remappings = ["poseidon-solidity/=node_modules/poseidon-solidity/"]
ffi = true
fs_permissions = [
    { access = "read-write", path = "./" },
    { access = "read", path = "../contracts/" },
    { access = "read", path = "../../crates/" },
]

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 1000 }

# Mainnet-fork tests (AAVE V3 integration). Requires `evm_version = "shanghai"`
# so the foundry REVM can execute live AAVE bytecode (post-Shanghai opcodes,
# including PUSH0). The default `paris` profile rejects PUSH0 with an
# InvalidOpcode revert — see `test/AckiNackiBridgeAaveFork.t.sol` docstring
# for the diagnosis. Solc 0.8.19 supports `shanghai`, and Ethereum mainnet
# has been on Shanghai since April 2023, so this is a safe override.
#
# Run with: `FOUNDRY_PROFILE=fork FORK_URL=$RPC forge test --match-contract ...Fork`
[profile.fork]
evm_version = "shanghai"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
