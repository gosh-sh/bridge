[package]
name = "ackinacki-bridge"
version = "0.2.0"
edition = "2021"
description = "End-user CLI for the Acki Nacki ↔ EVM bridge. Currently ships the `withdraw` subcommand: burn USDC on Acki Nacki via a single-custodian multisig, then produce + submit the Circuit-4 SHPLONK proof to withdraw on the EVM side. Additional subcommands (e.g. deposit) will land here."

# Build via the bridge-prover-libraries workspace (member symlink
# crates/bridge-prover-libraries/ackinacki-bridge → ../ackinacki-bridge):
#   cd crates/bridge-prover-libraries && cargo build -p ackinacki-bridge
# Path deps below are relative to that member path — i.e.
# crates/bridge-prover-libraries/ackinacki-bridge/. Since cargo preserves the
# symlink path (does not canonicalize) for relative resolution, `../foo` and
# `../../foo` walk from that directory, matching how bridge-relayer-daemon
# resolves the same layout.

[dependencies]
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"

# Auto-source $BRIDGE_CONFIG profile file at startup, before clap reads
# env= attrs. Existing shell env vars win (dotenvy respects them), so
# precedence is: --flag > shell env > profile file > compiled default.
dotenvy = "0.15"

# EIP-55 checksum validation + Address type for --to. The whole alloy stack is
# already pulled in transitively by bridge-relayer-daemon, so this is a no-cost
# add on the workspace graph.
alloy = { version = "2.0", features = [
    "providers",
    "provider-http",
    "signer-local",
    "signers",
    "network",
    "sol-types",
] }
alloy-primitives = "1"

# Decimal parsing with strict fractional-digit rejection. rust_decimal rejects
# excess precision cleanly; std f64 rounds and would violate the spec's
# "no rounding" rule for --amount.
rust_decimal = "1"

# TVM SDK — used in-library instead of shelling out to `tvm-cli`:
#   * account state fetch + BOC parsing (preflight checks 2 + 7)
#   * local execution of Solidity-ABI getters like getCustodians (checks 3-5)
#   * ABI-encoded body composition + signing + broadcast (burn stage)
tvm_client = { workspace = true }
tvm_block  = { workspace = true }

# Path deps — resolved from the member symlink at
# crates/bridge-prover-libraries/ackinacki-bridge/.
bridge-relayer-daemon = { path = "../bridge-relayer-daemon" }
bridge-event-witness  = { path = "../bridge-event-witness" }
bridge-prover-lib     = { path = "../bridge-prover-lib" }
bridge-gql-fetcher    = { path = "../bridge-gql-fetcher" }
acki-nacki-interface  = { path = "../../acki-nacki-interface" }

# `bytes_to_fr` — the exact conversion the prover uses for public inputs
# [6] and [7]. Reused rather than reimplemented so the preflight cannot
# drift from what the proof will actually carry.
gosh-dense-balanced-tree = { workspace = true }

# Atomic state-file writes. Draws a random name, retries on collision, and
# creates 0600 on Unix — the mode the rename carries onto the record.
tempfile = "3"

# statvfs + errno constants. Already in this workspace's lock file via
# transitive deps, so this costs nothing.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Test-only: building a real deployed-multisig account BOC offline, so a
# fake node has something `tvm_block::Account` will actually parse.
tvm_types = { workspace = true }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "test-util"] }

[[bin]]
name = "ackinacki-bridge"
path = "src/main.rs"
