[package]
name = "bridge-event-prove-circuit"
version = "0.1.0"
edition = "2021"

# Halo2 circuit that proves a `WithdrawalInitiated` event was emitted by
# TokenBridge.sol on an Acki Nacki block, while keeping `dstChainId`,
# `recipient`, and `sender` private. `amount` and `tokenId` are exposed as
# public inputs. Modeled after `gosh-dark-dex-halo2-new-circuit`.

[dependencies]
gosh-sha256-chip = { git = "https://github.com/gosh-sh/gosh-halo2-crypto-lib", branch = "bump-halo2-lib-v0.4.1" }
gosh-dense-balanced-tree = { git = "https://github.com/gosh-sh/gosh-halo2-crypto-lib", branch = "bump-halo2-lib-v0.4.1" }
# Native Poseidon hasher + Merkle tree helpers. Promoted from dev-dep so the
# `test_helpers` module (now exposed publicly) can be reused by downstream
# crates that need a deterministic synthetic witness for keygen — e.g.
# `bridge-prover-lib::keys::ensure_event_keys`.
dense-balanced-tree = { git = "https://github.com/gosh-sh/dense-balanced-tree.git", tag = "v1.0.0" }
halo2-base = { workspace = true }
halo2-ecc = { workspace = true }
bridge-poseidon = { path = "../bridge-poseidon" }

# `.git` suffix + `tag` are load-bearing: cargo treats
# `github.com/x/y` and `github.com/x/y.git` as DIFFERENT sources, so any
# other crate in the graph that spells the URL with `.git` (e.g.
# `dense-balanced-tree -> tvm_vm`) will pull a second copy. Tag pin
# additionally prevents drift with tvm-sdk's `main`. Kept in sync with
# `[patch."https://github.com/tvmlabs/tvm-sdk.git"]` in the workspace root.
tvm_types = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = "v3.0.6.an", package = "tvm_types" }
tvm_block = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = "v3.0.6.an", package = "tvm_block" }
failure = "0.1"

sha2 = "0.10"
hex = "0.4.3"
rand = "0.8"

itertools = "0.11"
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

pse-poseidon = { git = "https://github.com/axiom-crypto/pse-poseidon.git" }

[dev-dependencies]
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1", default-features = false, features = ["halo2-axiom", "test-utils"] }
