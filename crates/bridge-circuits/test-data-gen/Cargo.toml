[package]
name = "bridge-test-data-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
gosh_blst = { git = "https://github.com/gosh-sh/gosh_blst.git", rev = "a9da6e80b30143e04ca06ea1090525ba8cf1f299", features = ["portable"] }
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.12.0"
sha2 = "0.10"
hex = "0.4.3"
rand = "0.8"
anyhow = "1.0"
halo2-base = { workspace = true }
bridge-poseidon = { path = "../bridge-poseidon" }
gosh-dense-balanced-tree = { git = "https://github.com/gosh-sh/gosh-halo2-crypto-lib", branch = "bump-halo2-lib-v0.4.1" }
