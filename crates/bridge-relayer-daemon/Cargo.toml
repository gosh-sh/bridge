[package]
name = "bridge-relayer-daemon"
version = "0.1.0"
edition = "2021"
description = "Relayer skeleton for the AN→ETH bridge: fetches AN block data + proofs, drives them through `AckiNackiBridge.verifyBlock` on Ethereum (Phase 5.1)."

# Build via the an-bridge-prover workspace (member symlink
# crates/an-bridge-prover/bridge-relayer-daemon → ../bridge-relayer-daemon):
#   cd crates/an-bridge-prover && cargo test -p bridge-relayer-daemon
# Path deps below are relative to that member path.

[dependencies]
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"
alloy = { version = "2.0", features = [
    "providers",
    "provider-http",
    "rpc-types-eth",
    "signer-local",
    "signers",
    "contract",
    "network",
    "sol-types",
    "transport-http",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
acki-nacki-interface = { path = "../../acki-nacki-interface" }
bridge-prover-lib = { path = "../bridge-prover-lib" }

[dev-dependencies]
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "relayer"
path = "src/bin/relayer.rs"
