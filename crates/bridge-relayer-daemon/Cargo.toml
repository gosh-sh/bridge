[package]
name = "bridge-relayer-daemon"
version = "0.1.0"
edition = "2021"
description = "Relayer skeleton for the AN→ETH bridge: fetches AN block data + proofs, drives them through `AckiNackiBridge.verifyBlock` on Ethereum (Phase 5.1)."

[dependencies]
# Core async + alloy (relayer-side only — no halo2 here).
# Migrated from ethers-rs 2.0.14 on 2026-05-17 to clear RUSTSEC-2026-0098/-0099/-0104
# (rustls-webpki) and the wider unmaintained-dep churn (`derivative`, `instant`,
# `fxhash`, `rustls-pemfile`). See the workspace Cargo.toml for full context.
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"
alloy = { version = "2.0", features = [
    "providers",
    "provider-http",
    "rpc-types-eth",
    "signer-local",
    "signers",
    "contract",
    "network",
    "sol-types",
    "transport-http",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"

[[bin]]
name = "relayer"
path = "src/bin/relayer.rs"
