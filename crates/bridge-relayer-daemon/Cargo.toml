[package]
name = "bridge-relayer-daemon"
version = "0.1.0"
edition = "2021"
description = "Relayer skeleton for the AN→ETH bridge: fetches AN block data + proofs, drives them through `AckiNackiBridge.verifyBlock` on Ethereum (Phase 5.1)."

# Build via the bridge-prover-libraries workspace (member symlink
# crates/bridge-prover-libraries/bridge-relayer-daemon → ../bridge-relayer-daemon):
#   cd crates/bridge-prover-libraries && cargo test -p bridge-relayer-daemon
# Path deps below are relative to that member path.

[dependencies]
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"
alloy = { version = "2.0", features = [
    "providers",
    "provider-http",
    "rpc-types-eth",
    "signer-local",
    "signers",
    "contract",
    "network",
    "sol-types",
    "transport-http",
    "eips",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
acki-nacki-interface = { path = "../../acki-nacki-interface" }
bridge-prover-lib = { path = "../bridge-prover-lib" }
bridge-gql-fetcher = { path = "../bridge-gql-fetcher" }
# In-process wrap of Poseidon-transcript proof bytes → snark-verifier `.snark`,
# so the daemon no longer shells out to `export-1a1b2-poseidon-snark` (which
# independently re-fetched + re-proved every bundle). Must be resolved through
# the bridge-prover-libraries workspace so its halo2-base [patch] rewrites apply.
bridge-snark-wrap = { path = "../bridge-snark-wrap" }
# In-process Circuit 4 (event) Poseidon prover — replaces the historical
# `SubprocessCircuit4SnarkProver` shell-out to `export-c4-poseidon-snark`
# (NB-Q9 PR-B). Same shape as the 1A/1B/2 lane above.
bridge-event-prover-lib = { path = "../bridge-event-prover-lib" }
# Event-witness exporter + enricher (Circuit 4 private witness). Used by the
# in-process withdraw_e2e driver to build/enrich a `PrivateWitness` from a
# freshly-captured WithdrawalInitiated ExtOut BOC before invoking the
# SubprocessWithdrawalProver.
bridge-event-witness = { path = "../bridge-event-witness" }
# Direct halo2-base dep pulls in `Params` / `ParamsProver` traits needed for
# SRS downsize + serialize in `ensure_srs_for_event`. Workspace = ensures the
# same halo2-axiom rev as bridge-prover-lib / bridge-snark-wrap resolve to.
halo2-base = { workspace = true }
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

[dev-dependencies]
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "relayer"
path = "src/bin/relayer.rs"
