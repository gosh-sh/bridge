[package]
name = "deposit-relayer-daemon"
version = "0.2.0"
edition = "2021"
description = "Relayer for the EVM→Acki Nacki deposit bridge: listens for `Deposit` events on Ethereum, generates the AN-consumable Halo2 proof triple, and submits it to the AN `TokenBridge.finalizeDeposit` entry point."

[dependencies]
# Core async + alloy (event listening + receipt/log decode — no halo2 here;
# the heavy deposit-prover circuit lives in its own cargo workspace and is
# invoked out-of-process by `SubprocessProofGenerator`).
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"
alloy = { version = "2.0", features = [
    "providers",
    "provider-http",
    "rpc-types-eth",
    "signer-local",
    "signers",
    "contract",
    "network",
    "sol-types",
    "transport-http",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
# Prometheus facade: the library records through `metrics::*` macros, the
# `daemon` subcommand installs the text exporter (`--metrics-addr`). Same
# versions as `bridge-relayer-daemon`, so one scrape config fits both.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
tempfile = "3"
fs2 = "0.4"
acki-nacki-interface = { path = "../acki-nacki-interface", features = ["tvm-sdk"] }
# Deposit-source allowlist, shared verbatim with `deposit-prover`.
deposit-chain-ids = { path = "../deposit-chain-ids" }
tvm_client = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = "v3.0.6.an", default-features = false, features = [
    "std",
    "rustls-tls-webpki-roots",
] }

# `tvm_client` → `tvm_vm` links the gosh halo2 forks. Inside the tvm-sdk
# workspace that is arranged by its root `[patch]` tables, which do not travel
# with a git dependency; without them cargo also pulls crates.io `halo2-axiom`
# and upstream `axiom-crypto/halo2-lib`, and `tvm_vm` fails with
# "EthCircuitImpl: Circuit<Fr> is not satisfied (multiple versions of
# halo2_axiom)". Mirror of tvm-sdk `v3.0.6.an` root `Cargo.toml` (same block
# as `crates/eth-light-client-relayer/Cargo.toml`).
[patch.crates-io]
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
halo2-axiom = { git = "https://github.com/gosh-sh/halo2-axiom", branch = "main" }

[patch."https://github.com/axiom-crypto/halo2-lib.git"]
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
halo2-ecc = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
zkevm-hashes = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }

[patch."https://github.com/axiom-crypto/axiom-eth"]
axiom-eth = { git = "https://github.com/gosh-sh/axiom-eth", rev = "1d61be00a63ec73b3f709d74eb9e6b09b754b911" }

[dev-dependencies]
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The `EthLogSource` tests answer JSON-RPC in-process (`src/fake_rpc.rs`).
alloy-json-rpc = "2"
tower-service = "0.3"

[[bin]]
name = "deposit-relayer"
path = "src/bin/deposit-relayer.rs"
