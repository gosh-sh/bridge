[package]
name = "eth-light-client-relayer"
version = "0.1.0"
edition = "2021"
description = "Beacon light-client relayer: poll Ethereum finality_update, prove step/rotate via eth-light-client-prover, submit to EthBeaconLightClient on Acki Nacki."

[dependencies]
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
fs2 = "0.4"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "http2",
    "charset",
] }
rlp = "0.5"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
acki-nacki-interface = { path = "../acki-nacki-interface" }
tvm_client = { git = "https://github.com/tvmlabs/tvm-sdk.git", tag = "v3.0.5.an", default-features = false, features = [
    "std",
    "rustls-tls-webpki-roots",
], optional = true }

# `tvm_client` → `tvm_vm` links the gosh halo2 forks. Inside the tvm-sdk
# workspace that is arranged by its root `[patch]` tables, which do not travel
# with a git dependency; without them cargo also pulls crates.io `halo2-axiom`
# and upstream `axiom-crypto/halo2-lib`, and `tvm_vm` fails with
# "EthCircuitImpl: Circuit<Fr> is not satisfied (multiple versions of
# halo2_axiom)". Mirror of tvm-sdk `v3.0.5.an` root `Cargo.toml`.
[patch.crates-io]
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
halo2-axiom = { git = "https://github.com/gosh-sh/halo2-axiom", branch = "main" }

[patch."https://github.com/axiom-crypto/halo2-lib.git"]
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
halo2-ecc = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
zkevm-hashes = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }

[patch."https://github.com/axiom-crypto/axiom-eth"]
axiom-eth = { git = "https://github.com/gosh-sh/axiom-eth", rev = "1d61be00a63ec73b3f709d74eb9e6b09b754b911" }

[features]
# Live AN submit pulls tvm-sdk (heavy halo2). Unit tests stay mock-only.
live-submit = ["acki-nacki-interface/tvm-sdk", "dep:tvm_client"]

[dev-dependencies]
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"

[[bin]]
name = "eth-lc-relayer"
path = "src/bin/eth-lc-relayer.rs"
# Default binary is shadow-capable (beacon-watch / daemon --dry-run).
# Live AN GraphQL submit needs `--features live-submit` (tvm-sdk).
