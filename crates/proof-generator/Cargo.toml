[package]
name = "proof-generator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "proof-generator"
path = "src/main.rs"

[dependencies]
halo2-base = { git = "https://github.com/axiom-crypto/halo2-lib", tag = "v0.4.1", default-features = false, features = ["halo2-axiom", "display"] }
snark-verifier-sdk = { git = "https://github.com/axiom-crypto/snark-verifier", tag = "v0.1.7", default-features = false, features = ["loader_halo2", "loader_evm", "halo2-axiom"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []

