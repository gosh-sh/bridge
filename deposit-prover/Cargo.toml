# This is a standalone package, not part of the parent workspace
# (axiom-eth requires axiom-crypto's halo2-lib, incompatible with scroll-tech)
[workspace]

[package]
name = "deposit-prover"
version = "0.1.0"
edition = "2021"
authors = ["Acki Nacki Bridge Team"]
license = "MIT OR Apache-2.0"

[lib]
name = "deposit_prover"
path = "src/lib.rs"

[dependencies]
# Axiom-eth for Ethereum state proofs.
# Ported 2026-05-30 from the PSE backend to the gosh `halo2-axiom` backend
# (the one the AN-side `ZKHALO2VERIFYWITHVK` opcode reads). Uses the gosh
# axiom-eth fork (branch `gosh-stable-rlcmanager-assignment`) whose RlcManager
# names `VirtualRegionManager::Assignment` explicitly for the stable gosh
# halo2-base, and the bumped gosh halo2-lib fork (v0.4.1 / zkevm-hashes 0.2.1).
# Pinned @ 1d61be0 — dev-confirmed canonical rev (QC-PROV-02, 2026-07-17).
axiom-eth = { git = "https://github.com/gosh-sh/axiom-eth", rev = "1d61be00a63ec73b3f709d74eb9e6b09b754b911", default-features = false, features = [
  "providers",
  "display",
  "aggregation",
  "halo2-axiom",
] }

# Halo2 — declared against the upstream axiom-crypto/halo2-lib URL so the
# [patch] block below can redirect *all* references (including the ones
# axiom-eth pulls transitively) to the gosh bumped fork in one place.
halo2-base = { git = "https://github.com/axiom-crypto/halo2-lib.git", tag = "v0.4.1-git", default-features = false, features = [
  "halo2-axiom",
  "display",
] }
halo2-ecc = { git = "https://github.com/axiom-crypto/halo2-lib.git", tag = "v0.4.1-git", default-features = false, features = [
  "halo2-axiom",
  "display",
] }

# SNARK verifier — gosh fork. Must use the gosh fork because axiom-eth
# (gosh-stable-rlcmanager-assignment) already pulls snark-verifier from
# gosh-sh/snark-verifier transitively; mixing axiom-crypto's v0.1.7 with
# that would yield two snark-verifier crates in the graph and break
# type unification in src/aggregation.rs + src/prover.rs.
#
# Pinned to 164bd42 — the rev gosh-sh/axiom-eth (branch
# gosh-stable-rlcmanager-assignment, tip 1d61be0) pulls transitively. This MUST
# stay equal to axiom-eth's snark-verifier rev: any divergence yields two
# `snark-verifier-sdk` copies in the graph, and `EthCircuitImpl<Fr, _>` (from
# axiom-eth) then satisfies only its own copy's `CircuitExt`, breaking the
# `gen_snark_shplonk` / `gen_evm_verifier_shplonk` calls in src/prover.rs that
# bind `C: CircuitExt<Fr>` against *our* copy.
#
# History: was ccdb510, but axiom-eth's branch tip advanced to pull 164bd42,
# desyncing the two and breaking the build (E0277 on `EthCircuitImpl: CircuitExt`).
# If axiom-eth moves again, bump this rev to match (and refresh Cargo.lock).
snark-verifier = { git = "https://github.com/gosh-sh/snark-verifier", rev = "164bd42e300b382239e63b16532faca539d6b324", default-features = false, features = [
  "loader_evm",
  "loader_halo2",
  "halo2-axiom",
] }
snark-verifier-sdk = { git = "https://github.com/gosh-sh/snark-verifier", rev = "164bd42e300b382239e63b16532faca539d6b324", default-features = false, features = [
  "loader_evm",
  "loader_halo2",
  "halo2-axiom",
] }


# Poseidon hash for commitment computation. Same redirect-via-[patch] pattern
# as halo2-base/halo2-ecc above.
zkevm-hashes = { git = "https://github.com/axiom-crypto/halo2-lib.git", tag = "v0.4.1-git", default-features = false, features = [
  "halo2-axiom",
] }

# Ethereum - using specific version to avoid DepositTransaction issue
ethers = { git = "https://github.com/gakonst/ethers-rs", rev = "f0e5b194f09c533feb10d1a686ddb9e5946ec107", features = [
  "abigen",
  "ws",
  "rustls",
] }
# ethers-core - must match axiom-eth's version exactly
ethers-core = { version = "=2.0.14", features = ["optimism"] }

# RLP encoding/decoding
alloy-rlp = { version = "0.3", features = ["derive"] }
ethereum-types = "0.14"

# Merkle-Patricia Trie
cita_trie = "5.0"
hasher = "0.1"

# Field arithmetic
ff = "0.13"
# halo2curves is provided transitively by the gosh halo2-axiom backend via the
# `halo2_base::halo2_proofs::halo2curves` re-export (no direct PSE dep needed).

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.42", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
ppot-rs = { version = "0.1.1", optional = true }
sha2 = "0.10.9"
num-bigint = "0.4"
rand = "0.8"

[features]
# Optional: .ptau file conversion support
ppot-rs = ["dep:ppot-rs"]

# Redirect axiom's git halo2-lib (any tag — v0.4.1-git here directly, v0.5.0-git
# pulled transitively by gosh-sh/snark-verifier@main) to the gosh bumped fork
# so the whole graph (deposit-prover + axiom-eth + snark-verifier-sdk) shares
# one halo2 backend. Mirrors acki-nacki-to-eth-bridge-halo2-prover's setup.
[patch."https://github.com/axiom-crypto/halo2-lib.git"]
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
halo2-ecc = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }
zkevm-hashes = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "bump-halo2-lib-v0.4.1" }

# Unify on the gosh halo2 backend: snark-verifier-sdk (pulled by zkevm-hashes
# v0.4.1) would otherwise bring axiom's crates.io halo2-axiom, clashing with
# gosh-sh/halo2-axiom. This mirrors the [patch] the bumped fork carries.
[patch.crates-io]
halo2-axiom = { git = "https://github.com/gosh-sh/halo2-axiom", branch = "main" }
