<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090" role="img" aria-label="UML deployment diagram, specification level: which executable manifests which process, and the files each process keeps its state in"><style>
svg { --bg:#f6f7f9; --surface:#ffffff; --fg:#1b2230; --muted:#5b6577;
          --k-cli:#1f6fd1; --k-dr:#1a8a4a; --k-dl:#c76a00; --k-aa:#8a3fc2; --k-lc:#0e8a8a;
          --font: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); }
@media (prefers-color-scheme: dark) { svg { --bg:#12161d; --surface:#1a2029; --fg:#e6eaf1; --muted:#9aa5b6; --k-cli:#6aa8f5; --k-dr:#4cc47e; --k-dl:#f0a04b; --k-aa:#bf8af0; --k-lc:#4fc7c7; } }
.bg { fill: var(--bg); }
text { fill: currentColor; font-family: var(--font); }
.st, .nm, .sm { text-anchor: middle; }
.st { font-size: 11px; fill: var(--muted); } .nm { font-size: 13px; font-weight: 600; }
.sm, .sm2 { font-size: 11px; fill: var(--muted); }
.comp, .art { fill: var(--surface); stroke: currentColor; stroke-width: 1.2; }
.icon { fill: var(--surface); stroke: currentColor; stroke-width: 1; }
.dep { fill: none; stroke: currentColor; stroke-width: 1.1; stroke-dasharray: 5 4; }
.k-cli { stroke: var(--k-cli); }
rect.k-cli { stroke-width: 2.2; }
.k-dr { stroke: var(--k-dr); }
rect.k-dr { stroke-width: 2.2; }
.k-dl { stroke: var(--k-dl); }
rect.k-dl { stroke-width: 2.2; }
.k-aa { stroke: var(--k-aa); }
rect.k-aa { stroke-width: 2.2; }
.k-lc { stroke: var(--k-lc); }
rect.k-lc { stroke-width: 2.2; }
